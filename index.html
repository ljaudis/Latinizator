<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Латинизатор</title>
    <style>
        /* Переменные для тем */
        :root {
            --bg-body: #f4f4f9;
            --bg-sidebar: #fff;
            --bg-card: #fff;
            --text-main: #333;
            --text-muted: #666;
            --border-color: #ccc;
            --btn-variant-bg: #f8f9fa;
            --btn-variant-hover: #e2e6ea;
            --dropdown-bg: #fff;
            --group-label-bg: #e9ecef;
            --transition-speed: 0.3s;
        }

        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-sidebar: #1e1e1e;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #aaa;
            --border-color: #444;
            --btn-variant-bg: #2d2d2d;
            --btn-variant-hover: #3d3d3d;
            --dropdown-bg: #252525;
            --group-label-bg: #333;
        }

        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            background: var(--bg-body); 
            color: var(--text-main);
            display: flex; 
            min-height: 100vh; 
            transition: background var(--transition-speed), color var(--transition-speed);
        }
        
        /* Кнопка смены темы */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            padding: 10px;
            cursor: pointer;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all var(--transition-speed);
        }

        /* Боковая панель */
        .sidebar { 
            width: 250px; 
            background: var(--bg-sidebar); 
            border-right: 1px solid var(--border-color); 
            padding: 20px; 
            flex-shrink: 0; 
            transition: background var(--transition-speed), border var(--transition-speed);
        }
        .sidebar h3 { font-size: 14px; color: var(--text-muted); text-transform: uppercase; margin-top: 0; margin-bottom: 15px; }
        .variant-group { display: none; }
        .variant-group.active { display: block; }
        
        /* Основная область */
        .main-content { flex-grow: 1; padding: 40px; max-width: 900px; }
        
        textarea { 
            width: 100%; 
            height: 180px; 
            margin: 10px 0; 
            padding: 15px; 
            font-size: 16px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            background: var(--bg-card);
            color: var(--text-main);
            box-sizing: border-box; 
            resize: vertical; 
            transition: background var(--transition-speed), border var(--transition-speed), color var(--transition-speed);
        }
        
        /* --- ВЫПАДАЮЩИЙ СПИСОК ЯЗЫКОВ --- */
        .language-dropdown {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .dropbtn {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            min-width: 250px; 
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dropbtn:hover { background-color: #0056b3; }
        .dropbtn:after { content: '\25BE'; padding-left: 10px; } 

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--dropdown-bg);
            min-width: 320px; 
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 100;
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: background var(--transition-speed);
        }

        .lang-group-row {
            display: flex;
            border-bottom: 2px solid var(--text-main); 
        }
        
        .lang-group-row:last-child { border-bottom: none; }

        .group-label {
            background-color: var(--group-label-bg);
            color: var(--text-muted);
            font-weight: bold;
            font-size: 12px;
            width: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            writing-mode: vertical-rl; 
            transform: rotate(180deg);
            padding: 5px 0;
            flex-shrink: 0;
            border-right: 1px solid var(--border-color);
            transition: background var(--transition-speed);
        }

        .group-buttons {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .dropdown-content button {
            color: var(--text-main);
            padding: 10px 16px;
            text-decoration: none;
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            border-radius: 0;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .dropdown-content button:hover { background-color: var(--btn-variant-hover); }
        .show { display: block; }

        .variant-btn { 
            width: 100%; 
            text-align: left; 
            padding: 10px 15px; 
            margin-bottom: 5px; 
            font-size: 14px; 
            cursor: pointer; 
            border-radius: 5px; 
            border: 1px solid var(--border-color); 
            background: var(--btn-variant-bg); 
            color: var(--text-main); 
            transition: 0.3s; 
        }
        .variant-btn:hover { background: var(--btn-variant-hover); }
        .variant-btn.active { background: #28a745 !important; color: white; border-color: #1e7e34; }

        h2 { color: var(--text-main); margin-top: 0; transition: color var(--transition-speed); }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" title="Переключить тему">🌓</button>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme');

        // Проверка сохраненной темы
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        themeToggle.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>
</body>
</html>

    // Функция для открытия/закрытия меню
    function toggleDropdown() {
        document.getElementById("myDropdown").classList.toggle("show");
    }

    // Закрыть меню, если кликнули в другое место
    window.onclick = function(event) {
        if (!event.target.matches('.dropbtn')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    }

    function setLang(lang) {
        currentLang = lang;
        
        // 1. Обновляем текст на кнопке
        document.getElementById('current-lang-btn').innerText = langNames[lang];
        
        // 2. Закрываем меню (если открыто)
        document.getElementById("myDropdown").classList.remove("show");

        // 3. Показываем нужную группу вариантов в сайдбаре
        document.querySelectorAll('.variant-group').forEach(g => g.classList.remove('active'));
        const group = document.getElementById('variants-' + lang);
        group.classList.add('active');

        // 4. Устанавливаем вариант по умолчанию для этого языка
        const firstVariant = group.querySelector('button').getAttribute('onclick').match(/'([^']+)'/)[1];
        setVariant(firstVariant);
    }

    function setVariant(variant) {
        currentVariant = variant;
        // Подсвечиваем активный вариант в сайдбаре
        document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
        // Ищем кнопку по тексту или аттрибуту (упростим поиск)
        const allVariantBtns = document.querySelectorAll('.variant-btn');
        allVariantBtns.forEach(btn => {
            if (btn.getAttribute('onclick').includes(`'${variant}'`)) {
                btn.classList.add('active');
            }
        });

        latinize();
    }

    function capitalizeFirst(str) {
        if (!str) return "";
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function latinize() {
        let text = document.getElementById('input').value;
        let result = text;

        const currentRules = rules[currentVariant] || rules[currentLang];
        // Проверка на случай пустых правил
        if (!currentRules) return;

        const sortedKeys = Object.keys(currentRules).sort((a, b) => b.length - a.length);

        for (let key of sortedKeys) {
            let regLower = new RegExp(key, 'g');
            result = result.replace(regLower, currentRules[key]);

            let regUpper = new RegExp(key.toUpperCase(), 'g');
            result = result.replace(regUpper, capitalizeFirst(currentRules[key]));
        }

        document.getElementById('output').value = result;
    }

    document.getElementById('input').addEventListener('input', latinize);
