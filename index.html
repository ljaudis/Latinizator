<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Латинизатор</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f9; display: flex; min-height: 100vh; }
        
        /* Боковая панель */
        .sidebar { width: 200px; background: #fff; border-right: 1px solid #ccc; padding: 20px; flex-shrink: 0; }
        .sidebar h3 { font-size: 14px; color: #666; text-transform: uppercase; margin-top: 0; }
        .variant-group { display: none; }
        .variant-group.active { display: block; }
        
        /* Основная область */
        .main-content { flex-grow: 1; padding: 40px; max-width: 900px; }
        
        textarea { width: 100%; height: 180px; margin: 10px 0; padding: 15px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; resize: vertical; }
        
        .controls { margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
        
        button { padding: 10px 15px; font-size: 14px; cursor: pointer; border-radius: 5px; border: 1px solid #ddd; background: white; color: #333; transition: 0.2s; }
        button:hover { background: #f0f0f0; }
        button.active { background: #007bff !important; color: white; border-color: #0056b3; }
        
        /* Стили для кнопок вариантов в сайдбаре */
        .variant-btn { width: 100%; text-align: left; margin-bottom: 5px; background: #f8f9fa; }
        .variant-btn.active { background: #28a745 !important; }

        h2 { color: #333; margin-top: 0; }
    </style>
</head>

<div class="sidebar">
    <h3>Вариант</h3>
    <div id="variants-ru" class="variant-group active">
        <button class="variant-btn active" onclick="setVariant('ru')">РусЛат</button>
        <button class="variant-btn" onclick="setVariant('ru2')">ГОСТ 7.79 A (ISO 9)</button>
		<button class="variant-btn" onclick="setVariant('ru3')">ГОСТ 7.79 Б (ISO 9)</button>
		<button class="variant-btn" onclick="setVariant('ru4')">ALA-LC</button>
		<button class="variant-btn" onclick="setVariant('ru5')">BGN/PCGN</button>
		<button class="variant-btn" onclick="setVariant('ru6')">ICAO (Машиносчитаемые документы)</button>
		<button class="variant-btn" onclick="setVariant('ruyak1')">Яковлев (Без диакритики)</button>
		<button class="variant-btn" onclick="setVariant('ruyak2')">Яковлев (Типографский)</button>
		<button class="variant-btn" onclick="setVariant('ruyak3')">Яковлев (Яналиф)</button>
		<button class="variant-btn" onclick="setVariant('rusov')">Ларин</button>
		<button class="variant-btn" onclick="setVariant('rubel')">Белинский</button>
		<button class="variant-btn" onclick="setVariant('rukod')">Кодинский</button>
    </div>
    <div id="variants-ua" class="variant-group">
        <button class="variant-btn active" onclick="setVariant('ua')">Иречек</button>
		<button class="variant-btn active" onclick="setVariant('ua2')">Абэцадло (Лозинский)</button>
		<button class="variant-btn active" onclick="setVariant('ua3')">ALA-LC</button>
		<button class="variant-btn active" onclick="setVariant('ua4')">Научный</button>
		<button class="variant-btn active" onclick="setVariant('ua5')">BGN/PCGN</button>
    </div>
    <div id="variants-by" class="variant-group">
        <button class="variant-btn active" onclick="setVariant('by')">Латинка</button>
		<button class="variant-btn active" onclick="setVariant('bypol')">Польский алфавит</button>
		<button class="variant-btn active" onclick="setVariant('by2')">ALA-LC</button>
		<button class="variant-btn active" onclick="setVariant('by3')">ISO 9</button>
		<button class="variant-btn active" onclick="setVariant('by4')">BGN/PCGN</button>

    <div id="variants-bu" class="variant-group">

		<button class="variant-btn active" onclick="setVariant('bu4')">Данчев</button>
    </div>
    <div id="variants-mac" class="variant-group">
        <button class="variant-btn active" onclick="setVariant('mac')">ALA-LC, BGN/PCGN, Национальная академия</button>
		<button class="variant-btn active" onclick="setVariant('mac3')">ISO 9</button>
		<button class="variant-btn active" onclick="setVariant('mac2')">Гаевица</button>
    </div>
</div>

<div class="main-content">
    <h2>Латинизатор текста</h2>

    <div class="controls">
        <button id="btn-ru" class="active" onclick="setLang('ru')">Русский</button>

</div>

			"ж": "ž", 															   		    //ж
			"щ": "št",  											                 		   //щ
            "я": "ja", "ю": "ju",                                                        //йотированные
			"а": "a", "e": "e", "и": "i", "о": "o", "у": "u", 	    	   	//обычные
			"а̀": "à", "ѐ": "è", "ѝ": "ì", "о̀": "ò", "у̀": "ù",
			"й": "j", "ј": "ǰ"                                                          //ээээ 
			
	
        }
    };

    let currentLang = 'ru';
    let currentVariant = 'ru';

    function setLang(lang) {
        currentLang = lang;
        // 1. Активируем кнопку языка
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + lang).classList.add('active');

        // 2. Показываем нужную группу вариантов в сайдбаре
        document.querySelectorAll('.variant-group').forEach(g => g.classList.remove('active'));
        const group = document.getElementById('variants-' + lang);
        group.classList.add('active');

        // 3. Устанавливаем вариант по умолчанию для этого языка
        const firstVariant = group.querySelector('button').getAttribute('onclick').match(/'([^']+)'/)[1];
        setVariant(firstVariant);
    }

    function setVariant(variant) {
        currentVariant = variant;
        // Подсвечиваем активный вариант в сайдбаре
        document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
        // Ищем кнопку по тексту или аттрибуту (упростим поиск)
        const allVariantBtns = document.querySelectorAll('.variant-btn');
        allVariantBtns.forEach(btn => {
            if (btn.getAttribute('onclick').includes(`'${variant}'`)) {
                btn.classList.add('active');
            }
        });

        latinize();
    }

    function capitalizeFirst(str) {
        if (!str) return "";
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function latinize() {
        let text = document.getElementById('input').value;
        let result = text;

        const currentRules = rules[currentVariant] || rules[currentLang];
        const sortedKeys = Object.keys(currentRules).sort((a, b) => b.length - a.length);

        for (let key of sortedKeys) {
            let regLower = new RegExp(key, 'g');
            result = result.replace(regLower, currentRules[key]);

            let regUpper = new RegExp(key.toUpperCase(), 'g');
            result = result.replace(regUpper, capitalizeFirst(currentRules[key]));
        }

        document.getElementById('output').value = result;
    }

    document.getElementById('input').addEventListener('input', latinize);
</script>
